name: Collecting Dar es salaam Stock Exchange Market Data

on:
  schedule:
    - cron: "0 18 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dse:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download Dar es salaam Stock Exchange data
        run: |
          python main.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dataset/cleaned.csv
          git add dataset/ohlcv.csv

          git diff --cached --quiet || git commit -m "Update Dar es salaam Stock Exchange Market Data"

          git push
